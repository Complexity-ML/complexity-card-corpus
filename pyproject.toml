[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complexity-card-corpus"
version = "0.1.0"
description = "Build, audit, and tokenize the Complexity Card Corpus V2 SFT dataset."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=2.0",
  "pyarrow>=18",
  "tiktoken>=0.9",
  "tokenizers>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
card-corpus = "complexity_card_corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/complexity_card_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: full-capacity generation or release audit, run explicitly with pytest -m slow",
]
